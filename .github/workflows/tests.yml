# The mod built, with every test, on GitHub's machines, on every commit: the
# jar a server and the bots load. Masurium Launcher is tested in its own
# repository.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: mod (java)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: build, and every test
        working-directory: mod
        run: ./gradlew build --console=plain
