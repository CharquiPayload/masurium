modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "marionette_bot"
version = "1.0.0"
displayName = "Marionette (bot)"
description = "The hands of the bot: look and act in the world, driven over HTTP by the agent."
authors = "CharquiPayload"

# SIDE = CLIENT: this only lives in the headless client. The server has no reason
# to know it exists, so it cannot reject the connection for missing mods.
[[mods.dependencies.marionette_bot]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[mods.dependencies.marionette_bot]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"

# The headless client's anti-render mixins (see mixin/ and marionette_bot.mixins.json)
[[mixins]]
config = "marionette_bot.mixins.json"
