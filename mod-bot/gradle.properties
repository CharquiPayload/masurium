# The daemon stays ON on purpose: turning it off makes every build pay for a
# JVM start, which once made iterating on the mod take minutes.
# The heap is capped because bots take about 3 GB each: on a small machine you
# may not be able to build while bots are running, and it is better to know it.
org.gradle.jvmargs=-Xmx1536m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
