plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'marionette'
base { archivesName = 'marionette-bot' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.248'

    mods {
        marionette_bot {
            sourceSet sourceSets.main
        }
    }
}

// Both mods compile the shared code from the same place: no copies.
sourceSets.main.java.srcDir '../common/java'

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
