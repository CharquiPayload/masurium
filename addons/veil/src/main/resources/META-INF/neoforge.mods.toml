modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# An add-on: a jar of its own that teaches the bot to live with one
# third-party mod. This one is for Veil, a rendering library that ships
# inside other mods (Sable, among others) and assumes there is a GPU. On a bot
# with no screen there is none, and Veil crashes the client before the mod
# handshake. Nothing here touches Veil's own jar: these are mixins, applied
# when its classes load, and only on a headless bot.
#
# Without Veil in the pack the jar does nothing: every mixin has
# defaultRequire 0 and simply does not apply.

[[mods]]
modId = "marionette_veil"
version = "1.0.0"
displayName = "Marionette: Veil without a GPU"
description = "Keeps Veil (bundled in Sable and others) from touching a GPU that a headless bot does not have. Client side only."
authors = "CharquiPayload"

[[mods.dependencies.marionette_veil]]
modId = "marionette_bot"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "CLIENT"

[[mods.dependencies.marionette_veil]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[mods.dependencies.marionette_veil]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"

[[mods.dependencies.marionette_veil]]
modId = "veil"
type = "optional"
versionRange = "[4.0.0,)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "marionette_veil.mixins.json"
