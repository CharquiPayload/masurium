plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'marionette'
base { archivesName = 'marionette-veil' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.248'
    mods {
        marionette_veil {
            sourceSet sourceSets.main
        }
    }
}

repositories { mavenCentral() }

dependencies {
    // The core, for Bot.headless(): the one definition of "no screen" lives
    // there, and an add-on asks instead of guessing. Build the core first.
    compileOnly fileTree(dir: '../../mod/build/libs', include: 'marionette-*.jar', exclude: '*-sources*')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
