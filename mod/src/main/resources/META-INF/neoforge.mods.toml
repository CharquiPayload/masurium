modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# ONE jar, two mods. The same file goes in a server's mods folder and in a bot
# client's, and each half only wakes up where it belongs:
#
#   masurium_server    is @Mod(dist = Dist.DEDICATED_SERVER): on a dedicated server
#                      it is the whole mod, and a client never constructs it, so a
#                      player's own single-player or LAN world opens no port and
#                      has no /masurium. Bots join dedicated servers only.
#   masurium_bot       is @Mod(dist = Dist.CLIENT): a dedicated server never
#                      constructs it, so none of its client classes are ever loaded
#                      there. Its mixins are declared under "client" for the same
#                      reason, and BotSideTest fails the build if a server or common
#                      class ever reaches into either.
#
# Two files were a mistake waiting to happen: a bot is a separate installation from
# the server it joins, so deploying one half without the other left the other
# silently ignoring what it did not understand.

[[mods]]
modId = "masurium_server"
version = "1.0.0"
displayName = "Masurium"
description = "Minecraft bots driven by an AI over HTTP: the server's answers and, on a bot's client, the bot's hands."
authors = "CharquiPayload"

[[mods.dependencies.masurium_server]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[mods.dependencies.masurium_server]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[mods]]
modId = "masurium_bot"
version = "1.0.0"
displayName = "Masurium (bot)"
description = "The hands of the bot: look and act in the world, driven over HTTP by the agent. Client side only."
authors = "CharquiPayload"

[[mods.dependencies.masurium_bot]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[mods.dependencies.masurium_bot]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "masurium_bot.mixins.json"
