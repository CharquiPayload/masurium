plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0+puppets'
group = 'masurium'
base { archivesName = 'masurium' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.248'

    // TWO mods, ONE jar: the same file goes in a server's mods folder and in a bot
    // client's. They were two jars, and a bot is a separate installation from the
    // server it joins, so the halves drifted apart and the one that did not
    // understand a setting ignored it without a word. One file cannot drift.
    //
    // masurium_server needs both sides: on a dedicated server it is the whole mod,
    // and on a client it is what an integrated world answers. masurium_bot is
    // @Mod(dist = Dist.CLIENT), so a dedicated server never constructs it and never
    // loads a client class through it — which BotSideTest keeps true.
    // EXPERIMENT (branch experiment/server-bots): a dedicated server to try the
    // puppets on, `./gradlew runServer`, in run-server/.
    runs {
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        masurium_server {
            sourceSet sourceSets.main
        }
        masurium_bot {
            sourceSet sourceSets.main
        }
    }
}

repositories { mavenCentral() }

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
